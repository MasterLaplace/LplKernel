name: Build LplKernel CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches-ignore: [ "ga-ignore-**", "gh-pages" ]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**.in'
      - '**.inl'
      - '**.s'
      - '**.S'
      - '**.inc'
      - '**.ld'
      - '**.sh'
      - '**.lua'
      - '**/Makefile'
      - '**/make.config'
      - 'DEPENDENCIES.lock'
      - '**/build_lplkernel.yml'
      - 'tools/acpi/**'
      - '**.asl'

permissions:
  contents: read

jobs:
  build_lplkernel:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Cache downloaded toolchain sources
      uses: actions/cache@v5
      with:
        path: |
          ~/src
        key: ${{ runner.os }}-lplkernel-src-v1

    - name: Restore toolchain cache
      uses: actions/cache@v5
      with:
        path: /usr/local/i686-elf
        key: ${{ runner.os }}-lplkernel-toolchain-v1

    - name: Install dependencies and build cross-toolchain (if not cached)
      run: |
        set -e
        if [ -x /usr/local/i686-elf/bin/i686-elf-gcc ]; then
          echo "Cross toolchain already installed — skipping build"
          echo "PATH=/usr/local/i686-elf/bin:$PATH" >> $GITHUB_ENV
          i686-elf-gcc --version || true
          exit 0
        fi

        sudo apt-get update
        sudo apt-get install -y build-essential bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo wget make ninja-build xorriso grub-pc-bin mtools dosfstools

        mkdir -p ~/src
        cd ~/src
        if [ ! -d binutils-2.36 ]; then
          wget -q http://ftp.gnu.org/gnu/binutils/binutils-2.36.tar.gz
          tar -xzf binutils-2.36.tar.gz
        else
          echo "binutils sources cached"
        fi
        if [ ! -d gcc-10.2.0 ]; then
          wget -q http://ftp.gnu.org/gnu/gcc/gcc-10.2.0/gcc-10.2.0.tar.gz
          tar -xzf gcc-10.2.0.tar.gz
        else
          echo "gcc sources cached"
        fi

        mkdir -p build-binutils
        cd build-binutils
        ../binutils-2.36/configure --target=i686-elf --prefix=/usr/local/i686-elf --disable-nls --disable-werror
        make -j$(nproc)
        sudo make install

        mkdir -p ../build-gcc
        cd ../build-gcc
        ../gcc-10.2.0/configure --target=i686-elf --prefix=/usr/local/i686-elf --disable-nls --enable-languages=c,c++ --without-headers
        make -j$(nproc) all-gcc all-target-libgcc
        sudo make install-gcc
        sudo make install-target-libgcc

        export PATH=/usr/local/i686-elf/bin:$PATH
        echo "PATH=/usr/local/i686-elf/bin:$PATH" >> $GITHUB_ENV
        i686-elf-gcc --version || true

        sudo mkdir -p /usr/local/i686-elf/.cache_marker || true
        sudo touch /usr/local/i686-elf/.cache_marker || true

    - name: Ensure host build tools
      run: |
        set -e
        echo "Runner: $(uname -a)"
        echo "PATH=$PATH"

        need_install=false
        for cmd in make grep; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            need_install=true
          fi
        done

        if [ "$need_install" = true ]; then
          echo "Missing required commands; attempting to install..."

          PM=""
          UPDATE_CMD=""
          INSTALL_CMD=""
          if command -v apt-get >/dev/null 2>&1; then
            PM="apt-get"
            UPDATE_CMD="update"
            INSTALL_CMD="install -y --no-install-recommends make grep mtools dosfstools"
          elif command -v yum >/dev/null 2>&1; then
            PM="yum"
            UPDATE_CMD="makecache"
            INSTALL_CMD="install -y make grep mtools dosfstools"
          elif command -v dnf >/dev/null 2>&1; then
            PM="dnf"
            UPDATE_CMD="makecache"
            INSTALL_CMD="install -y make grep mtools dosfstools"
          elif command -v apk >/dev/null 2>&1; then
            PM="apk"
            UPDATE_CMD=""
            INSTALL_CMD="add --no-cache make grep mtools dosfstools"
          else
            echo "No supported package manager found (apt-get, yum, dnf, apk). Skipping installation.\nPlease run this job on an image with a package manager or preinstall required tools." >&2
            exit 0
          fi

          SUDO_CMD=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO_CMD="sudo"
          fi

          echo "Detected package manager: $PM"
          if [ -n "$UPDATE_CMD" ]; then
            $SUDO_CMD $PM $UPDATE_CMD
          fi
          $SUDO_CMD $PM $INSTALL_CMD
        fi

        make --version || true
        grep --version || true

    # The plain kernel, on purpose: this toolchain is gcc 10 without libstdc++, and the
    # engine, the mind and the memory need gcc 14 (deploy_portfolio.yml builds them).
    # Saying `none` keeps it the plain kernel even on a runner that has a sibling next to it.
    - name: Build ISO
      env:
        LPLPLUGIN_ROOT: none
        LPLASSISTANT_ROOT: none
        LPLKNOWLEDGE_ROOT: none
      run: |
        set -e
        ./clean.sh
        ./iso.sh

    - name: Check if build succeeded
      run: |
        set -e
        if [ ! -f lpl.iso ]; then
          echo "ISO not found - build failed"
          exit 1
        fi

  # The ACPI layer on the host: the tests ring 0 runs too, then the directory of each machine of
  # the quick list of recorded firmware.
  acpi_host:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1.2.5
      with:
        xmake-version: v3.1.1

    - name: The ACPI layer holds no architecture
      run: tools/acpi/check-portable.sh

    - name: The rule the oracle of _CST publishes processors by
      run: python3 -I -B tools/acpi/acpiexec_idle.py --self-test

    - name: The rule the slack oracle compares acpiexec's two runs by
      run: python3 -I -B tools/acpi/acpiexec_slack.py --self-test

    - name: The rule a real machine's C-states are compared with Linux's cpuidle by
      run: python3 -I -B tools/acpi/against_linux_cpuidle.py --self-test

    - name: The ACPI tests on the host
      run: |
        set -eo pipefail
        xmake build -y test-acpi
        build/acpi-host/test-acpi | tee acpi-host.log

    - name: The same tests with no loop run from records, which must print the same records
      run: |
        set -e
        build/acpi-host/test-acpi --predecoding off > acpi-host-decoded.log
        tools/parity.sh acpi-host.log acpi-host-decoded.log
        witness='host_predecoding_programs.the_boot_line_decides_whether_loops_run_from_records:'
        grep -q "$witness loops run from records" acpi-host.log || { echo "no loop ran from records"; exit 1; }
        grep -q "$witness no loop runs from records" acpi-host-decoded.log ||
            { echo "loops still ran from records with --predecoding off"; exit 1; }

    - name: The same tests for long mode's 52-bit addresses and the other profiles' caps
      run: |
        set -e
        build/acpi-host/test-acpi --physical-address-bits 52 --caps others > acpi-host-long-mode.log
        witness='advanced_configuration_and_power_interface_regions.a_simulated_host_opens_for_the_target_its_boot_line_gives:'
        grep -q "$witness physical_address_bits=52" acpi-host-long-mode.log ||
            { echo "the simulated hosts did not open for 52 bits"; exit 1; }
        grep -q "$witness max_nodes=32768" acpi-host-long-mode.log ||
            { echo "the simulated hosts did not open with the other profiles' caps"; exit 1; }

    - name: The quick list of recorded machines
      run: |
        set -e
        tools/acpi-corpus.sh fetch quick
        tools/acpi-corpus.sh check quick

    - name: The needs path of the quick list, which neither reaches nor executes an opcode the interpreter does not run
      run: |
        set -e
        tools/acpi-corpus.sh closure quick
        tools/acpi-corpus.sh initialize quick

    - name: The kept data of the quick list and 4 mutated copies, which the check flags as its builds leave it unbuilt
      run: tools/acpi-corpus.sh kept quick 4

  # The made-up ACPI tables against their ASL (specification §8.2): each generated header holds what the pinned
  # iasl compiles its sources to, iasl running only in the sandbox of tools/acpi/sandbox.sh.
  acpi_fixtures:
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Ubuntu 24.04 lets no unprivileged process make a user namespace, which bwrap needs without setuid
    # (kernel.apparmor_restrict_unprivileged_userns=1). The runner is a throwaway machine: lifting the restriction
    # there is what lets the sandbox run, and nothing falls back to running iasl outside it; inside the sandbox, no
    # further user namespace can be made. It comes first, so that the sandbox works before anything is built.
    - name: Bubblewrap, and user namespaces for it
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        setting=kernel.apparmor_restrict_unprivileged_userns
        echo "$setting was $(sysctl -n "$setting")"
        sudo sysctl -w "$setting=0"

    - name: The sandbox holds its promises
      run: tools/acpi/sandbox.sh --self-test

    # Built on every run, never restored from a cache: a cache keyed on the commit would hide a change that breaks
    # the build, and would put back a .git/config that git then reads outside the sandbox.
    - name: Build iasl at the commit tools/acpi-corpus.sh pins
      run: |
        set -e
        sudo apt-get install -y bison flex
        tools/acpi-corpus.sh fetch acpica

    - name: Every generated header holds what its ASL compiles to
      run: tools/acpi/regenerate-fixtures.sh
