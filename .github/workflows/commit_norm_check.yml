name: Commit Norm Checker

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-pull-request-title:
    name: Verify Commit Name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          keyword_regex='^[a-z]+(\([0-9A-Za-z_./-]+\))?!?: [0-9a-z_.-]'
          if [[ ! "$TITLE" =~ $keyword_regex ]]; then
            echo "Title: $TITLE"
            echo "::error::Pull requests land as one squashed commit named after their title. Use: type(scope): subject, for example fix(net): refuse an empty packet"
            exit 1
          fi

  verify-pushed-commit:
    name: Verify Commit Name
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check the message of the pushed commit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          keyword_regex='^[a-z]+(\([0-9A-Za-z_./-]+\))?!?: [0-9a-z_.-]'
          if [[ ! "$subject" =~ $keyword_regex ]]; then
            echo "Subject: $subject"
            echo "::error::Commit message does not follow Conventional Commits. Use: type(scope): subject"
            exit 1
          fi
