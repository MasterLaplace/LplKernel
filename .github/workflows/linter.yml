name: Linter GitHub Action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_code:
    name: Lint with clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore apt .deb cache
        id: cache-clang-restore
        uses: actions/cache/restore@v4.3.0
        with:
          path: .apt-cache
          key: ${{ runner.os }}-clang-format-v1

      - name: Install clang-format (from cache if available)
        run: |
          if [ "${{ steps.cache-clang-restore.outputs.cache-hit }}" != 'true' ]; then
            mkdir -p .apt-cache
            sudo apt-get update
            sudo apt-get -o Dir::Cache::archives="$(pwd)/.apt-cache" install --download-only -y clang-format || true
            sudo chown -R "$(id -u):$(id -g)" .apt-cache || true
          fi

          if ls .apt-cache/*.deb 1> /dev/null 2>&1; then
            echo "Installing clang-format from cached .deb"
            sudo dpkg -i .apt-cache/*.deb || sudo apt-get install -f -y
          else
            echo "No cached debs found, installing via apt-get"
            sudo apt-get update
            sudo apt-get install -y clang-format
          fi

      - name: Check the formatting of tracked C/H files
        run: |
          if [ -z "$(git ls-files -- '*.c' '*.h')" ]; then
            echo "No tracked C/H files to check."
            exit 0
          fi

          failed=0
          while IFS= read -r -d '' f; do
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              echo "::error file=$f::no newline at the end of the file"
              failed=1
            fi
          done < <(git ls-files -z -- '*.c' '*.h')

          git ls-files -z -- '*.c' '*.h' | xargs -0 clang-format --dry-run --Werror || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::Formatting differs from .clang-format. From the repository root, run:"
            echo "git ls-files -z -- '*.c' '*.h' | xargs -0 clang-format -i"
            echo "then commit the result on the same branch."
            exit 1
          fi

      - name: Save apt .deb cache
        if: always()
        uses: actions/cache/save@v4.3.0
        with:
          path: .apt-cache
          key: ${{ runner.os }}-clang-format-v1
