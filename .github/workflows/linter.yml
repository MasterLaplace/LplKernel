name: Linter GitHub Action

on:
  push:
    branches-ignore: [ga-ignore-**, gh-pages]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '.github/workflows/linter.yml'

permissions:
  contents: write

concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_code:
    name: Lint with clang-format (auto-apply)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Restore apt .deb cache
        id: cache-clang-restore
        uses: actions/cache/restore@v4.3.0
        with:
          path: .apt-cache
          key: ${{ runner.os }}-clang-format-v1

      - name: Install clang-format (from cache if available)
        run: |
          if [ "${{ steps.cache-clang-restore.outputs.cache-hit }}" != 'true' ]; then
            mkdir -p .apt-cache
            sudo apt-get update
            sudo apt-get -o Dir::Cache::archives="$(pwd)/.apt-cache" install --download-only -y clang-format || true
            sudo chown -R "$(id -u):$(id -g)" .apt-cache || true
          fi

          if ls .apt-cache/*.deb 1> /dev/null 2>&1; then
            echo "Installing clang-format from cached .deb"
            sudo dpkg -i .apt-cache/*.deb || sudo apt-get install -f -y
          else
            echo "No cached debs found — installing via apt-get"
            sudo apt-get update
            sudo apt-get install -y clang-format
          fi

      - name: Format tracked C/C++ files (ensure newline at EOF + clang-format)
        id: files
        run: |
          files_count=$(git ls-files -- '*.c' '*.h' '*.cpp' '*.hpp' | wc -l)
          if [ "$files_count" -eq 0 ]; then
            echo "No tracked C/C++ files to format."
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          git ls-files -z -- '*.c' '*.h' '*.cpp' '*.hpp' | while IFS= read -r -d '' f; do
            if [ -s "$f" ]; then
              tail -c1 "$f" | read -r _ || echo >> "$f"
            else
              echo >> "$f"
            fi
          done

          git ls-files -z -- '*.c' '*.h' '*.cpp' '*.hpp' | xargs -0 clang-format -i

          echo "files=1" >> $GITHUB_OUTPUT

      - name: Show git status
        run: |
          git status --porcelain

      - name: Commit the formatting, signed by GitHub
        if: ${{ steps.files.outputs.files != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::$BRANCH accepts no direct commit: these files need formatting in a pull request."
            git diff --cached --stat
            exit 1
          fi
          git diff --cached --name-only -z | while IFS= read -r -d '' file; do
            jq -n --arg path "$file" --rawfile contents <(base64 -w0 -- "$file") '{path: $path, contents: $contents}'
          done | jq -s . > "$RUNNER_TEMP/additions.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            --slurpfile additions "$RUNNER_TEMP/additions.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                                  expectedHeadOid: $head,
                                  message: {headline: "style: apply clang-format"},
                                  fileChanges: {additions: $additions[0]}}}}' > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid'

      - name: Save apt .deb cache
        if: always()
        uses: actions/cache/save@v4.3.0
        with:
          path: .apt-cache
          key: ${{ runner.os }}-clang-format-v1
